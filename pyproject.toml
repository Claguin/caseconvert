[project]
name = "caseconvert"
version = "0.1.0"
description = "Convert strings between naming conventions: snake_case, camelCase, PascalCase, kebab-case, and more."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "David Frank" }]
keywords = ["case", "conversion", "naming", "snake_case", "camelCase", "utilities"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseconvert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
